name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    name: Analyze, Test, Build (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to the version used for local validation. Flutter 3.50
          # deprecates `package:flutter/material.dart` in favor of the new
          # `material_ui` package (32 infos with --fatal-infos) — migrate
          # deliberately later, don't let the channel bump break CI.
          flutter-version: 3.47.9
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --coverage

      - name: Build debug APK (compile gate)
        run: flutter build apk --debug

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
